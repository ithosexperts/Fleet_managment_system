name: CI/CD - Build, Verify & Automated Android APK Release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build-and-verify:
    name: Build Web & Test Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build --workspace=web

      - name: Build & Verify Backend Server
        run: npm run build --workspace=server

      - name: Run Database Integrity & Invariant Tests
        run: npm test

  build-android-apk:
    name: Build & Package Android APK
    needs: build-and-verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradlew
        working-directory: android
        run: chmod +x gradlew

      - name: Build Android Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TruckTracker-Driver-v1.1.0-APK
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Update GitHub Release Assets with Fresh APK
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android/app/build/outputs/apk/debug/TruckTracker-Driver-v1.1.0-debug.apk android/app/build/outputs/apk/debug/TruckTracker-v1.1.0.apk || true
          gh release upload v1.1.0 android/app/build/outputs/apk/debug/TruckTracker-Driver-v1.1.0-debug.apk android/app/build/outputs/apk/debug/TruckTracker-v1.1.0.apk --clobber || true

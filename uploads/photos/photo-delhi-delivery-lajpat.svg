<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141923" />
      <stop offset="100%" stop-color="#0c0e14" />
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#92400e" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#wallGrad)" />
  <rect x="20" y="20" width="760" height="460" rx="16" fill="none" stroke="#263147" stroke-width="2" />

  <!-- Loading Bay Background Structure -->
  <rect x="50" y="100" width="700" height="300" rx="8" fill="#131b2c" stroke="#1f2c45" />
  <line x1="50" y1="360" x2="750" y2="360" stroke="#334155" stroke-width="4" />
  
  <!-- Roller Shutter Outline -->
  <rect x="90" y="120" width="220" height="240" fill="#0f172a" stroke="#334155" stroke-width="2" />
  <line x1="90" y1="160" x2="310" y2="160" stroke="#1e293b" stroke-width="2" />
  <line x1="90" y1="200" x2="310" y2="200" stroke="#1e293b" stroke-width="2" />
  <line x1="90" y1="240" x2="310" y2="240" stroke="#1e293b" stroke-width="2" />
  <line x1="90" y1="280" x2="310" y2="280" stroke="#1e293b" stroke-width="2" />
  <line x1="90" y1="320" x2="310" y2="320" stroke="#1e293b" stroke-width="2" />

  <!-- Pallet with Stacked Boxes -->
  <rect x="130" y="345" width="140" height="15" fill="#475569" rx="2" />
  <!-- Box 1 -->
  <rect x="135" y="275" width="60" height="70" rx="4" fill="url(#boxGrad)" stroke="#b45309" stroke-width="1.5" />
  <rect x="145" y="295" width="40" height="15" fill="#ffffff" opacity="0.85" rx="2" />
  <line x1="150" y1="300" x2="180" y2="300" stroke="#000000" stroke-width="2" />
  <line x1="150" y1="304" x2="175" y2="304" stroke="#000000" stroke-width="1.5" />
  <!-- Box 2 -->
  <rect x="200" y="275" width="65" height="70" rx="4" fill="url(#boxGrad)" stroke="#b45309" stroke-width="1.5" />
  <rect x="210" y="295" width="45" height="15" fill="#ffffff" opacity="0.85" rx="2" />
  <line x1="215" y1="300" x2="250" y2="300" stroke="#000000" stroke-width="2" />
  <!-- Box 3 on top -->
  <rect x="165" y="210" width="70" height="65" rx="4" fill="url(#boxGrad)" stroke="#b45309" stroke-width="1.5" />
  <rect x="175" y="230" width="45" height="15" fill="#ffffff" opacity="0.85" rx="2" />

  <!-- Delivery Signoff Clipboard Sheet -->
  <rect x="360" y="130" width="360" height="235" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="3" />
  <!-- Clipboard Clip -->
  <rect x="500" y="118" width="80" height="22" rx="4" fill="#334155" stroke="#1e293b" />
  <circle cx="540" cy="126" r="4" fill="#94a3b8" />

  <text x="385" y="165" font-family="Inter, sans-serif" font-size="16" font-weight="800" fill="#0f172a">CARGO DELIVERY RECEIPT</text>
  <text x="385" y="185" font-family="'JetBrains Mono', monospace" font-size="12" fill="#475569">WAYBILL: WB-DEL-984210 • STOP #1</text>
  
  <line x1="385" y1="195" x2="695" y2="195" stroke="#e2e8f0" stroke-width="1.5" />
  
  <text x="385" y="215" font-family="Inter, sans-serif" font-size="12" fill="#334155">DESTINATION: Lajpat Nagar Central Depot, Delhi</text>
  <text x="385" y="235" font-family="Inter, sans-serif" font-size="12" fill="#334155">CONSIGNMENT: 40 FMCG &amp; Electronics Cartons</text>
  <text x="385" y="255" font-family="Inter, sans-serif" font-size="12" fill="#334155">RECEIVER: Manoj Tiwari (Store Incharge)</text>
  <text x="385" y="275" font-family="Inter, sans-serif" font-size="12" fill="#334155">CONDITION: Verified Intact • No Damage</text>

  <!-- Green Verified Stamp -->
  <rect x="540" y="285" width="150" height="42" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="2" />
  <text x="615" y="312" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#059669" text-anchor="middle">✓ DELIVERED</text>

  <!-- Watermark Header Banner -->
  <rect x="35" y="35" width="730" height="42" rx="6" fill="rgba(15, 23, 42, 0.85)" stroke="#1e293b" />
  <text x="50" y="62" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#10b981">DELIVERY PROOF VERIFIED</text>
  <text x="310" y="62" font-family="Inter, sans-serif" font-size="12" fill="#94a3b8">TRIP: TR-DEL-2026-01</text>
  <text x="560" y="62" font-family="Inter, sans-serif" font-size="12" fill="#c5a059">STOP 1 OF 5 COMPLETED</text>

  <!-- Footer Watermark Bar -->
  <rect x="35" y="420" width="730" height="46" rx="6" fill="#090d16" />
  <text x="50" y="448" font-family="'JetBrains Mono', monospace" font-size="12" fill="#cbd5e1">📍 28.5677° N, 77.2433° E • Lajpat Nagar Central Depot, Delhi</text>
  <text x="610" y="448" font-family="'JetBrains Mono', monospace" font-size="12" fill="#10b981">09:37:14 AM IST</text>
</svg>

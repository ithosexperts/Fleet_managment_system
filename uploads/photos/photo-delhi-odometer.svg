<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#151d2f" />
      <stop offset="100%" stop-color="#0a0c12" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c5a059" />
      <stop offset="100%" stop-color="#f5d485" />
    </linearGradient>
    <radialGradient id="meterGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c5a059" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#c5a059" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)" />
  <rect x="20" y="20" width="760" height="460" rx="16" fill="none" stroke="#2a3349" stroke-width="2" />

  <!-- Instrument Cluster Ring -->
  <circle cx="280" cy="240" r="140" fill="#111624" stroke="#1f283d" stroke-width="6" />
  <circle cx="280" cy="240" r="140" fill="url(#meterGlow)" />
  <circle cx="280" cy="240" r="120" fill="none" stroke="#2d3b5b" stroke-dasharray="4 8" stroke-width="4" />

  <!-- Speedometer Needle -->
  <line x1="280" y1="240" x2="230" y2="160" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" />
  <circle cx="280" cy="240" r="12" fill="#c5a059" />
  <circle cx="280" cy="240" r="6" fill="#0b0f19" />

  <!-- Speed Value -->
  <text x="280" y="295" font-family="Inter, sans-serif" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">42</text>
  <text x="280" y="315" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#64748b" text-anchor="middle">KM / H</text>

  <!-- Digital Odometer LCD -->
  <rect x="460" y="140" width="280" height="130" rx="10" fill="#080b11" stroke="#334155" stroke-width="2" />
  <rect x="475" y="155" width="250" height="45" rx="6" fill="#111827" stroke="#1f2937" />
  
  <text x="490" y="185" font-family="'JetBrains Mono', monospace" font-size="26" font-weight="800" fill="url(#goldGrad)" letter-spacing="4">048215.4</text>
  <text x="695" y="185" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#94a3b8">KM</text>
  
  <text x="490" y="222" font-family="Inter, sans-serif" font-size="12" fill="#10b981" font-weight="600">● TRIP DISTANCE: 14.8 KM</text>
  <text x="490" y="244" font-family="Inter, sans-serif" font-size="12" fill="#38bdf8" font-weight="600">● ENGINE OIL TEMP: 88°C (OPTIMAL)</text>

  <!-- Vehicle Info Badge -->
  <rect x="460" y="290" width="280" height="90" rx="8" fill="#141a29" stroke="#253047" />
  <text x="480" y="320" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">VEHICLE: DL01 TA 4920</text>
  <text x="480" y="342" font-family="Inter, sans-serif" font-size="12" fill="#94a3b8">MODEL: Tata Ultra T.7 (High Deck)</text>
  <text x="480" y="364" font-family="Inter, sans-serif" font-size="12" fill="#c5a059">DRIVER: Rahul Sharma (EMP-101)</text>

  <!-- Watermark Header Banner -->
  <rect x="35" y="35" width="730" height="42" rx="6" fill="rgba(15, 23, 42, 0.85)" stroke="#1e293b" />
  <text x="50" y="62" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#c5a059">TRUCKTRACKER PROOF LOG</text>
  <text x="310" y="62" font-family="Inter, sans-serif" font-size="12" fill="#94a3b8">TYPE: START TRIP ODOMETER</text>
  <text x="545" y="62" font-family="Inter, sans-serif" font-size="12" fill="#34d399">VERIFIED GPS ACCURACY: ±6m</text>

  <!-- Footer Watermark Bar -->
  <rect x="35" y="420" width="730" height="46" rx="6" fill="#090d16" />
  <text x="50" y="448" font-family="'JetBrains Mono', monospace" font-size="12" fill="#cbd5e1">📍 28.5355° N, 77.2680° E • Okhla Logistics Depot, New Delhi</text>
  <text x="610" y="448" font-family="'JetBrains Mono', monospace" font-size="12" fill="#f59e0b">08:05:22 AM IST</text>
</svg>
